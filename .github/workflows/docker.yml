name: Docker

# Builds the Dockerfile, and on a version tag publishes it as vesvault/ves --
# the name the image has always had on Docker Hub (the CLI is `ves`; the repo
# is libVES.c). Two images per release:
#
#   vesvault/ves:<version>      runtime -- the ves(1) CLI, ~107 MB
#   vesvault/ves:<version>-dev  toolchain + headers, for building against libVES
#
# The `build` job runs on every push/PR and does NOT publish. That part matters
# on its own: nothing in CI ever exercised the Dockerfile before, which is how
# it sat for years pinned to an abandoned liboqs image (~0.8) that was too old
# for the ML-KEM identifiers KeyAlgo_OQS.c passes to OQS_KEM_new. It built
# fine and `ves` ran, so the dead post-quantum path never surfaced. The smoke
# test below resolves ML-KEM through the built image so that failure mode
# cannot come back silently.
#
# Registries: GHCR always (GITHUB_TOKEN covers it, no setup). Docker Hub only
# once DOCKERHUB_USERNAME / DOCKERHUB_TOKEN exist as repository secrets --
# until then those tags are skipped rather than failing the release.
#
# SBOM: etc/image-sbom.js writes the runtime image's SBOM (CycloneDX 1.6). The
# `build` job writes one on every run, for the image it built, and keeps it as
# a run artifact, so a change that breaks it fails an ordinary push rather
# than the next release. After a release publishes, the `sbom` job writes it
# for the published image, by digest, and
#
#   - attaches ves-<version>-image.cdx.json to the GitHub release, opening a
#     draft release if none exists yet: add the notes and the make-dist
#     tarball to that draft, then publish it
#   - attests it to the image digest (actions/attest), stored with GitHub and
#     pushed to GHCR beside the image (as the tag sha256-<digest>: GHCR has no
#     referrers API). Docker Hub serves the same digest, so the one
#     attestation covers both. `gh attestation verify` looks for build
#     provenance unless told otherwise:
#       gh attestation verify oci://docker.io/vesvault/ves:<version> --owner vesvault \
#         --predicate-type https://cyclonedx.org/bom
#
# The image needs its own SBOM because no image scanner can find liboqs in it:
# it is compiled from source into /usr/local, not installed as a package.
# Run the workflow by hand with a version (Actions > Docker > Run workflow) to
# write and attach the SBOM for an image already published.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'A published version (e.g. 1.37): write its image SBOM, attach it to the release, attest it. Empty: build only.'
        required: false
        default: ''

permissions:
  contents: read

env:
  # Single-platform on purpose. liboqs is a ~10 minute native compile, so
  # linux/arm64 under QEMU is painfully slow; the right way to add it is a
  # matrix over native runners (ubuntu-latest + ubuntu-24.04-arm) building by
  # digest, then a manifest-merge job. Add "linux/arm64" here only with that.
  PLATFORMS: linux/amd64

jobs:
  build:
    name: Build image (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # load: true keeps the result in the local daemon so the smoke tests can
      # run it. That requires a single platform, which is what PLATFORMS is.
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: libves:ci
          # Distinct scopes: two builds sharing the default scope would each
          # overwrite the other's cache manifest on export.
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: libves:ci-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      # A build that succeeds proves nothing about the post-quantum path -- the
      # old liboqs pin compiled cleanly and still had no working ML-KEM. Assert
      # the CLI runs and that libVES actually surfaces the three ML-KEM sets.
      - name: Smoke test runtime image
        run: |
          docker run --rm libves:ci --version
          docker run --rm --entrypoint ldd libves:ci /usr/bin/ves | grep -q liboqs

      - name: Smoke test dev image (build against libVES via pkg-config)
        run: |
          cat > /tmp/probe.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <libVES.h>
          #include <libVES/VaultKey.h>
          #include <libVES/KeyAlgo_OQS.h>
          int main(void) {
              const libVES_KeyAlgo *algo = &libVES_KeyAlgo_OQS;
              char buf[128];
              int mlkem = 0;
              for (int i = 0; i < 256; i++) {
                  int l = libVES_KeyAlgo_methodstr(algo, buf, sizeof(buf), i);
                  if (l < 0) break;
                  if (l > 0 && !strncmp(buf, "ML-KEM", 6)) mlkem++;
              }
              printf("ML-KEM parameter sets via libVES: %d\n", mlkem);
              return mlkem == 3 ? 0 : 1;
          }
          EOF
          docker run --rm -v /tmp/probe.c:/src/probe.c:ro libves:ci-dev \
            sh -c 'cd /src && gcc -Wall -o /tmp/probe probe.c $(pkg-config --cflags --libs libVES) && /tmp/probe'

      # The image was never pushed, so it has no digest: the SBOM names it by
      # its image ID. The generator stops, writing nothing, if what it reads
      # does not hold together (no ML-KEM, another liboqs than the Dockerfile
      # pins, libVES's Debian dependencies missing).
      - name: SBOM of the runtime image
        run: node etc/image-sbom.js --revision "$GITHUB_SHA" libves:ci > ves-ci-image.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-ci
          path: ves-ci-image.cdx.json

  publish:
    name: Publish vesvault/ves
    # Only version tags publish. master pushes and PRs stop at `build`.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # `secrets` is not available to job-level `if:`, so the Docker Hub gate
      # is resolved here and consumed by the steps below.
      - name: Check whether Docker Hub is configured
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set -- publishing to GHCR only, docker.io/vesvault/ves will not be updated."
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag v1.36 -> 1.36, latest.
      #
      # NOT type=semver: this repo tags releases with two components (v1.34,
      # v1.35, v1.36), which is not valid semver, so type=semver parses nothing
      # and emits no tags at all. That is silent until the push step fails with
      # "tag is needed when pushing to registry" (and an empty
      # org.opencontainers.image.version label) -- which is how the v1.36
      # release first went out. Match the ref textually instead.
      #
      # One pattern, because with a two-component tag {{version}} and
      # {{major}}.{{minor}} are the same string. If patch releases ever start
      # (v1.36.1), add type=match,pattern=v(\d+\.\d+),group=1 for a floating
      # 1.36. `latest` comes from flavor latest=auto, which covers type=match.
      - name: Tags for the runtime image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ves
            name=docker.io/vesvault/ves,enable=${{ steps.hub.outputs.enabled == 'true' }}
          tags: |
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.title=ves
            org.opencontainers.image.description=libVES + VES CLI: Simple, Safe and Secure Encryption At-rest

      # Same versions, -dev suffix, plus a floating `dev`. latest=false so the
      # dev image never claims :latest.
      - name: Tags for the dev image
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ves
            name=docker.io/vesvault/ves,enable=${{ steps.hub.outputs.enabled == 'true' }}
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1,suffix=-dev
            type=raw,value=dev
          labels: |
            org.opencontainers.image.title=ves (dev)
            org.opencontainers.image.description=libVES build environment: toolchain, headers and pkg-config for building against libVES

      # provenance: false keeps a plain single-platform manifest. The default
      # attestation manifest renders as a stray "unknown/unknown" entry in the
      # Docker Hub tag listing.
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha,scope=dev

  sbom:
    name: SBOM of the published image
    # After a release publishes, or by hand for a version already published.
    # always(): on a manual run `publish` is skipped, and this still runs.
    needs: publish
    if: >-
      always() &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write           # attach the SBOM to the release
      packages: write           # push the attestation to GHCR
      id-token: write           # sign the attestation (Sigstore, through GitHub)
      attestations: write
      artifact-metadata: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ves
    defaults:
      run:
        shell: bash
    steps:
      # The image's revision can be older than this checkout (a manual run
      # from master), and the generator reads the Dockerfile at that revision.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which release
        id: rel
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v=$INPUT_VERSION; else v=${GITHUB_REF_NAME#v}; fi
          [[ $v =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::not a release version: '$v'"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$v" > /dev/null || { echo "::error::no tag v$v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SBOM names one digest, so both registries must serve that image.
      # Docker Hub's digest is the SHA-256 of its raw manifest, piped straight
      # into the hash: a $(...) capture would drop a trailing newline.
      # (imagetools' --format does not help: some buildx versions ignore it
      # and print their default text.)
      - name: Pull the image; check Docker Hub serves the same one
        id: img
        env:
          V: ${{ steps.rel.outputs.version }}
        run: |
          docker pull -q "$GHCR_IMAGE:$V"
          d=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$GHCR_IMAGE:$V" | sed -n "s#^$GHCR_IMAGE@##p" | head -1)
          [[ $d =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest recorded for $GHCR_IMAGE:$V"; exit 1; }
          if hub=$(docker buildx imagetools inspect --raw "docker.io/vesvault/ves:$V" 2> /dev/null | sha256sum | cut -d' ' -f1); then
            hub=sha256:$hub
            [ "$hub" = "$d" ] || { echo "::error::docker.io/vesvault/ves:$V is $hub and $GHCR_IMAGE:$V is $d; one SBOM cannot name both"; exit 1; }
          else
            echo "::warning::docker.io/vesvault/ves:$V not found; the SBOM is for the GHCR image only"
          fi
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: SBOM
        env:
          V: ${{ steps.rel.outputs.version }}
          D: ${{ steps.img.outputs.digest }}
        run: node etc/image-sbom.js --digest "$D" "$GHCR_IMAGE:$V" > "ves-$V-image.cdx.json"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.rel.outputs.version }}
          path: ves-${{ steps.rel.outputs.version }}-image.cdx.json

      # Uploaded again, same name, on every run: the SBOM is deterministic, so
      # a re-run replaces it with the same bytes unless the image changed.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ steps.rel.outputs.version }}
        run: |
          f=ves-$V-image.cdx.json
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" "$f" --clobber
          else
            gh release create "v$V" --draft --verify-tag --title "v$V" --notes "" "$f"
            echo "::notice::opened a draft release v$V with the image SBOM: add the notes and libves-$V.tar.gz, then publish it"
          fi

      - name: Attest the SBOM to the image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.img.outputs.digest }}
          sbom-path: ves-${{ steps.rel.outputs.version }}-image.cdx.json
          push-to-registry: true
